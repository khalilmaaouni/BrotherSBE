<title>BrotherSBE: design before code, evidence before done</title>

<style>
/* The BrotherSBE booklet shares BrotherMode's design language on purpose: same
   structural CSS, same three type roles, same components. They are brothers and
   should read as brothers. One thing moves: the accent walks one step around
   the wheel from BrotherMode's deep green to a petrol blue, at the same depth
   and saturation, on the same warm paper with the same amber and brick
   supports. Blue carries the blueprint and assurance associations that suit a
   product whose first rule is design before code. */

  --paper: #FAF8F4; --paper-2: #F3F0E9; --ink: #22302C; --muted: #5C6B66; --faint: #5E6C67;

  --brick: #8C3A2B; --brick-soft: #F8ECE8; --line: #DDE4E0; --line-strong: #C4CFC9;
  --code-bg: #1B2724; --code-ink: #E4EDE9; --code-dim: #8FAFA5;
  --ok: #00543A; --info-ink: #00436B; --warn-ink: #6B4400; --hot-ink: #8C2D00;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Hoefler Text", Georgia, serif;
  --body: "Avenir Next", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

    --paper: #101A1D; --paper-2: #172327; --ink: #E4EBE8; --muted: #A3B2AC; --faint: #8B9A94;
    --accent: #55B4D8; --accent-soft: #14232B; --amber: #E0A55A; --amber-soft: #241B10;
    --brick: #E39079; --brick-soft: #271713; --line: #26333A; --line-strong: #38474F;
    --code-bg: #080D0F; --code-ink: #D7E4DF; --code-dim: #7E9B92;
    --ok: #5FD3AE; --info-ink: #7FC4F5; --warn-ink: #F0B95A; --hot-ink: #FFA582;
  }
}
:root[data-theme="dark"] {
  --paper: #101A1D; --paper-2: #172327; --ink: #E4EBE8; --muted: #A3B2AC; --faint: #8B9A94;
  --accent: #55B4D8; --accent-soft: #14232B; --amber: #E0A55A; --amber-soft: #241B10;
  --brick: #E39079; --brick-soft: #271713; --line: #26333A; --line-strong: #38474F;

main { min-width: 0; }

.part-label { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.13em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 0.85rem; }
.part-blurb { color: var(--muted); font-size: 1.04rem; max-width: 62ch; margin: 0 0 2.6rem; }

h3 { font-family: var(--display); font-weight: 600; font-size: 1.5rem; line-height: 1.2; letter-spacing: -0.01em; margin: 3rem 0 0.7rem; text-wrap: balance; }
h4 { font-weight: 650; font-size: 1.01rem; margin: 2.1rem 0 0.5rem; }
p, ul, ol { max-width: 68ch; }
p { margin: 0 0 1.1rem; }
main ul, main ol { padding-left: 1.15rem; margin: 0 0 1.2rem; }
main li { margin-bottom: 0.45rem; }
strong { font-weight: 650; }

.statement { font-family: var(--display); font-weight: 600; font-size: clamp(1.5rem, 3.6vw, 2.1rem); line-height: 1.22; letter-spacing: -0.012em; margin: 2.2rem 0 1.4rem; max-width: 24ch; text-wrap: balance; }
.statement.wide { max-width: 34ch; }

.evidence::before { content: "evidence"; color: var(--faint); letter-spacing: 0.11em; text-transform: uppercase; font-size: 0.64rem; margin-right: 0.6rem; }

tbody td, tbody th { border-bottom: 1px solid var(--line); padding: 0.7rem 0.9rem 0.7rem 0; vertical-align: top; }
tbody th { text-align: left; font-weight: 600; }

table.tight tbody td, table.tight tbody th { padding-top: 0.5rem; padding-bottom: 0.5rem; }
table.tight tbody th { white-space: nowrap; }
td code, th code { font-size: 0.86em; }

.svg-body { font-family: var(--body); font-size: 13px; }
.svg-small { font-family: var(--body); font-size: 11.5px; }

.panel { border: 1px solid var(--line-strong); border-radius: 3px; padding: 1.2rem 1.3rem; margin: 0 0 1.8rem; max-width: 62rem; background: var(--paper-2); }
.panel h4 { margin-top: 0; }

@media print {
  nav.toc, .langbar { display: none; }
