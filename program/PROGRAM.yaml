# Program record for the BrotherSBE public release.
# Source of truth for scope and budgets: program/MASTER-PLAN.md (sections 9 to 11).

program: brothersbe-public-release
objective: >
  Turn BrotherSBE's strong assurance engine into the simplest, most guided,
  most maintainable engineering product in its category.
version_target: 1.0.0
product_owner: Khalil Maaouni
status: delivery_blueprint_no_public_release_authorized
plan: MASTER-PLAN.md
baseline_reviewed: dacee900d24d40b351bc117ebbf001406bb09699
plan_date: 2026-07-31

token_budget:
  planned_total: 6200000
  hard_ceiling: 7410000
  derivation: >
    hard_ceiling is the SUM of the per-item caps in MASTER-PLAN.md sections 10,
    recomputed mechanically rather than typed: 430000 + 890000 + 1180000 +
    1130000 + 1200000 + 1240000 + 1340000. It moved from 7400000 on 2026-08-01
    when wave-4 was found stating 1.18M over items summing to 1.20M.
  note: >
    Estimates, not a promise. The release is evidence gated, not date gated.
    Reaching 75 percent of a task cap without a passing acceptance criterion
    triggers a scope review; reaching 100 percent stops the task.

target_window:
  earliest_stable: 2026-11-09
  latest_stated: 2026-11-23
  condition: only if every release gate in the plan passes

# The plan defines seven waves, numbered 0 through 6.
waves:
  - id: wave-0
    name: Truth reset and feature freeze
    work_items: BR-0001 to BR-0006
    token_budget: 430000
  - id: wave-1
    name: Canonical lifecycle and maintainable contracts
    work_items: BR-0101 to BR-0106
    token_budget: 890000
  - id: wave-2
    name: Guided experience and onboarding
    work_items: BR-0201 to BR-0208
    token_budget: 1180000
  - id: wave-3
    name: Installation, packaging, update, and rollback
    work_items: BR-0301 to BR-0307
    token_budget: 1130000
  - id: wave-4
    name: Cross-host adapters
    work_items: BR-0401 to BR-0409
    token_budget: 1200000
  - id: wave-5
    name: Team control, governance, and release engineering
    work_items: BR-0501 to BR-0507
    token_budget: 1240000
  - id: wave-6
    name: Human validation and release candidate
    work_items: BR-0601 to BR-0607
    token_budget: 1340000

# Release gate categories, one per plan section 11.x. A stable release requires
# every gate in every category to pass; a documented no-go is a valid outcome.
release_gates:
  - truth-and-security
  - installation
  - beginner-experience
  - engineering-experience
  - team-experience
  - cross-host-support
  - maintainability
  - public-readiness

# ---------------------------------------------------------------------------
# The 2026-08-06 master plan layer, added after the founder approved
# program/MASTER-PLAN-2026-08-06.md. The seven waves above remain the record of
# the 2026-07-31 release program; the plan reconciles the two as milestones and
# names which meaning of 1.0.0 each one carries. Work items BR-1000 to BR-1008
# carry this layer.
# ---------------------------------------------------------------------------

plan_2026_08_06: MASTER-PLAN-2026-08-06.md
owed_register: OWED.json
principles: ../docs/PRINCIPLES.md

milestones:
  - id: M1
    name: The 1.0.0 tag
    definition: >
      Engineering complete, all six dimensions at mechanical nine and refuter
      checked, the release packet assembled. The tag itself is cut by the
      founder alone. Distribution is the public repository with install.sh and
      the plugin manifest.
    work_items: BR-1000 to BR-1007
  - id: M2
    name: Human validated stable
    definition: >
      The benchmark kit has run with real unfamiliar users, findings are
      repaired, and only then does stable language apply. The founder schedules
      these runs after the tag, by his own ratified score bar.
    work_items: after BR-1006
  - id: M3
    name: Reach
    definition: >
      Cross host adapters, marketplace submission and IDE surfaces. Out of scope
      until M2 closes. Loop G is the only M3 slice funded now and it never gates
      the tag.
    work_items: BR-1008

plan_waves:
  - id: phase-0
    name: Controls before work
    work_items: BR-1000
    token_budget: 1800000
  - id: loop-b
    name: Contracts, the foundation everything consumes
    work_items: BR-1001
    token_budget: 2000000
  - id: loop-c
    name: Install to nine
    work_items: BR-1002
    token_budget: 2000000
  - id: loop-d
    name: Workspace foundation, loopback only
    work_items: BR-1003
    token_budget: 2000000
  - id: loop-e
    name: Guided operations and the human benchmark kit
    work_items: BR-1004
    token_budget: 2000000
  - id: loop-f
    name: Team and maintainability closed
    work_items: BR-1005
    token_budget: 2000000
  - id: packet
    name: The release packet
    work_items: BR-1006
    token_budget: 600000
  - id: parallel
    name: Windows, under an explicit founder exception
    work_items: BR-1007
    token_budget: 400000
  - id: loop-g
    name: Codex track, never gating the tag
    work_items: BR-1008
    token_budget: 1500000
