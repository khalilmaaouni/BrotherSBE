id: BR-1016
title: "The three-estate evaluation, and the one part of it I must not do"
why: >
  An external assessment scored this project engineering rigor 94, skill-system
  quality 92, release readiness 58, overall 83, and concluded that what is
  missing is not more machinery but independent proof, a smaller trusted core,
  clean cross-platform execution and a real release record. The founder asked
  for a three-estate evaluation (backend service, data warehouse, pipeline or
  infrastructure) with nine published measures before any organization-wide
  rollout.
persona_need: "P2 small engineering team and P4 solo engineer, both of whom are being asked to trust numbers nobody outside this project produced"
owner: fable-orchestrator
reviewer: independent-human
status: not_started
wave: post-release
milestone: M2
depends_on:
  - "BR-1006"
spec: program/MASTER-PLAN-2026-08-06.md, plus the founder's assessment of 2026-08-07
# THE CORRECTION, recorded at the moment it is taken rather than discovered in a
# report later. The assessment's first named gap is INDEPENDENT PROOF. I cannot
# supply it. If I run three estates against this tool and publish the numbers,
# that is self-assessment wearing an evaluation's clothes, and it is the exact
# overclaim every gate in this repository exists to refuse. A false-positive
# rate I compute about my own gates is not a false-positive rate; it is my
# opinion with a decimal point.
#
# So this item splits in two, and only one half is mine:
#
# MINE (buildable, and worth building):
#   - The scenario definitions. Twelve of them, four per estate, written so two
#     different operators run the same thing: new endpoint, contract change,
#     migration, production incident; material KPI, model change,
#     reconciliation, backfill; failure recovery, state mutation, rollback,
#     parallel writer.
#   - The instrumentation that makes the nine measures fall out of a run rather
#     than being reconstructed afterwards: time to first useful result, gate
#     false positives and false negatives, human interventions, token and
#     execution cost, defects caught before review, defects missed,
#     abandonment or bypass rate.
#   - The report template, including the two comparisons the assessment asks
#     for: against unassisted work, and against one named peer.
#   - A seeded defect set, so "defects missed" is measurable at all. Without
#     planted defects whose locations are known in advance, a missed defect is
#     invisible by construction and the number is fiction.
#
# NOT MINE (and saying so is the point):
#   - Running the three estates. That needs operators who did not write this
#     tool, on codebases this project has never seen. The founder recruits them;
#     the same people who give him M2's human numbers can give him these.
#   - Judging the results. An assessment I score is not independent either.
#
# WHAT WOULD FLIP THIS: nothing about my access or effort. Only a human running
# it. If the founder says he wants my numbers as a rehearsal rather than as
# evidence, I will produce them clearly labelled as a rehearsal, and they must
# never appear in a comparison table beside real ones.
acceptance:
  - "twelve scenarios exist, one file each, executable by an operator who has never seen this repository"
  - "a seeded defect set with known locations, so defects-missed is measurable rather than assumed"
  - "instrumentation emits all nine measures from a run, with no measure reconstructed by hand"
  - "the report template names its two comparisons and refuses to render a number it did not measure"
  - "the three estates are run by operators who did not build this tool, and the results carry their names"
estimated_days: 3
token_budget: 2000000
tokens_used: null
started_at: null
completed_at: null
evidence: []
risks:
  - risk: "The harness gets built and the runs never happen, leaving a measurement apparatus that measures nothing and reads as if it did."
    mitigation: "The harness ships with every measure showing NO-DATA until a real run fills it, and the release documents say the evaluation is unrun rather than pending."
    severity: high
  - risk: "Self-run numbers leak into a table beside independent ones and stop being distinguishable."
    mitigation: "The template carries a provenance column per row naming who ran it, and refuses to render a comparison where that column is empty."
    severity: high
blocked_by: []
alerts: []
