id: BR-1010
title: "Unit testing protocol, end to end, for backend developers and QA"
why: >
  Founder priority, stated 2026-08-06: backend developers and QA need one
  end to end unit testing protocol, not folklore. BrotherSBE already enforces
  pieces of this on itself (calibrated tests that were watched failing, the
  ran evidence gate, silent failure lints on test code, refuters that
  re-execute) but nothing packages that discipline as a protocol a team can
  adopt: how tests are written, calibrated, mapped to acceptance criteria,
  run, evidenced, and reviewed, from a developer's first test to QA's
  traceability check. This item designs and ships that protocol as a product
  capability.
persona_need: "P2 small engineering team: backend developers writing the tests and QA tracing them to acceptance criteria"
owner: fable-orchestrator
reviewer: qa-refuter
status: not_started
wave: phase-0
milestone: M1
depends_on:
  - "BR-1009"
spec: to be written first, design before build, per docs/PRINCIPLES.md section 1
acceptance:
  - "a design dossier (T2) exists and the founder approved it before any build: protocol scope, the three layer verification stance applied to unit tests, calibration as a first class requirement, acceptance to test traceability for QA"
  - "the protocol ships as a product surface (skill or reference plus templates), not a chat habit"
  - "sbe evidence receipts capture unit test runs with the command, exit code and duration, so a test claim is checkable"
  - "traceability: a QA reader can map each acceptance criterion of a work item to the test that proves it, or see the gap named"
  - "a worked example in the sandbox: one calibrated test written, watched failing, restored, its receipt recorded"
  - "eval cases guard the protocol docs against drift, same treatment as every shipped doc"
  - "python3 tools/test_sbe.py and the full eval battery stay green"
estimated_days: 1
# cap basis: program/MASTER-PLAN-2026-08-06.md section 6, the founder-ratified
