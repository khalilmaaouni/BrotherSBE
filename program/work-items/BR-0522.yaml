id: BR-0522
title: Microsoft Teams notify now, bot later
why: >
  Microsoft Teams is where an enterprise team actually looks, so the ledger has
  to reach it. This item is deliberately two stages, because the vendor's own
  capability boundary makes them two different integrations. Stage one is
  notify-only through the Workflows app webhook, which needs no bot, no tenant
  app registration, and no engine code beyond a POST. Stage two is a real Teams
  bot using Adaptive Card Universal Actions, which is the only supported way to
  render a button that does something, and which drives an ordinary Jira issue
  transition rather than any approval API of our own. Design and acceptance come
  from design/team-operating-model, and the exporter rows of 07-verification.md
  are the source of the criteria below.
owner: product-engineer
reviewer: independent-reviewer
status: not started
wave: team-control
