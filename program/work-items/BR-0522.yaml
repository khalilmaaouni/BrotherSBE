risks:
  - >
    Buttons and notifications cannot be the same integration. A plain incoming
    webhook supports every Adaptive Card element except Action.Submit, and the
    Workflows-based replacement states outright that button rendering is not
    supported. This is a capability boundary, not a preference, and it is what
    splits this item into two stages.
  - >
    Legacy actionable message cards with potentialAction buttons do exist and do
    work, but only for users with an Exchange Online license and only on the
    connector infrastructure being retired. Building on them would be building
    on a deadline.
  - >
    A fully working bot can be silently inert for a subset of users because
    tenant app permission policy, or the newer app-centric management, blocks it
    per user or per group. Policy changes can take hours to propagate, so a
    green test in one tenant proves nothing about another.
  - >
    Webhooks and connectors are unavailable in GCC High, DoD and 21Vianet-
    operated Teams, and the vendor documentation does not clearly state the
    Workflows replacement's status in those clouds. Any sovereign-cloud
    deployment needs its own check before this item is scheduled there.
alerts:
  - >
    Vendor deadline: Office 365 and Microsoft 365 connectors within Microsoft
    Teams are being retired, with the final rollout window to disable them
    stated as 2026-05-18 to 2026-05-22. New connector creation was already
    blocked from 2024-08-15. Any notifier built on the legacy incoming connector
    stops delivering in that window, so stage one is built on the Workflows app
    trigger from the first line of code and never on a connector URL.
  - >
    Vendor deadline, reported but not confirmed on the primary source: a
    2026-03-31 deadline for migrating connector URLs is cited by secondary
    coverage and was not found verbatim on the vendor's own retirement post at
    fetch time. Treat it as a reason to move earlier, not as a date to plan
    against.
  - >
    Governance step, before stage two ships: confirm the target tenant's app
    permission policy allows the custom bot for every intended approver group,
    and name the tenant administrator who owns that grant. This is a rollout
    step with an owner, not a launch-day discovery.
  - >
    Governance step: an unattended service cannot silently post to a channel
    with plain Graph application permissions. The least-privileged send
    permission is delegated, and the app-only permission is restricted to
    migration scenarios. So the send path is a webhook or a bot, never a bare
    Graph call with a client-credentials token, and this constraint is recorded
    here so it is not rediscovered in implementation.
