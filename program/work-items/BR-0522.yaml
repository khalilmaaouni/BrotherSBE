acceptance:
  - "the configured notification endpoint is a Workflows app trigger URL, asserted by a test that refuses a legacy Office 365 connector URL shape"
  - "every notification payload is under the 28 KB message size limit, asserted before send rather than discovered as a rejection"
  - "the send path respects the documented 4 requests per second sustained rate, proven by a throttle test"
  - "a throttled or rejected send is detected from the response body as well as the status code, because connector-style endpoints do not always return a real 429"
  - "notifications are notify-only: a test asserts the stage one payload contains no action that claims to change state"
  - "a deliberately failed notification leaves the merge path unaffected, proven by a test that fails the notifier and asserts no gate changed verdict"
  - "stage two only: an Action.Execute invoke reaches the bot and returns an updated card, proven per target user group rather than once in a test tenant"
  - "stage two only: the button drives an ordinary Jira issue transition and the transition is refused by Jira until its own approval step resolves"
