id: BR-0521
title: Asana exporter
why: >
  Teams that coordinate in Asana rather than Jira need the same one-way feed:
  the ledger broadcasts, the board reflects. This item builds a thin exporter
  that reads the append-only event stream and writes Asana tasks, converting a
  task to the approval subtype where the work item carries an approval gate. It
  is a sibling of BR-0520, deliberately separate so one vendor's outage or
  rewrite never touches the other. Design and acceptance come from
  design/team-operating-model, and the exporter rows of 07-verification.md are
  the source of the criteria below.
owner: product-engineer
reviewer: independent-reviewer
status: not started
wave: team-control
depends_on:
  - BR-0000
  - BR-0520
spec: design/team-operating-model/03-adr.md
acceptance:
  - the exporter runs to success with a read-only ledger credential and holds no repository write token
  - "replaying a fixed event stream twice produces one task per event, proven by an idempotency test that diffs workspace state after each pass"
  - "a deliberately failed export leaves the merge path unaffected, proven by a test that fails the exporter and asserts no gate changed verdict"
  - "a task that carries an approval gate ends with resource_subtype equal to approval, asserted on the task object rather than inferred from approval_status"
  - "the create-then-convert sequence is retryable, proven by a test that interrupts after create and asserts a second run converts rather than duplicating"
  - "custom field writes address fields by gid and assert the value shape the field type requires, so a text value never lands in an enum field"
  - "webhook subscriptions, if any are added later, are registered narrowly with resource_subtype, action and field filters rather than subscribing broadly"
  - dash scan over every new and edited file returns 0 matches
estimated_days: null
token_budget: null
tokens_used: null
started_at: null
completed_at: null
evidence: []
risks:
  - >
    Creating a task as an approval in a single call is unverified. What research
    confirmed is the two-step path: create an ordinary task, then update it with
    resource_subtype set to approval, because setting approval_status alone does
    not convert a task. The exporter is designed around the verified path, and
    the two-step sequence has to be idempotent as a result.
  - >
    Asana REST rate limits and webhook retry backoff thresholds were not
    researched. Only the field names for tracking webhook health were confirmed,
    not the numeric limits. Batch sizing must be calibrated against the real
    workspace before any bulk backfill.
  - >
    If this exporter ever grows an inbound half, it would contradict the stance
    recorded in design/team-operating-model/03-adr.md. Any such proposal is a
    superseding decision record, not a change to this work item.
alerts:
  - >
    Governance step, before any code ships: the Asana workspace or organization
    must grant the exporter's service identity access to the target projects and
    portfolios, and someone on the Asana side owns that grant. An exporter that
    authenticates but cannot see the project fails silently in a way that looks
    like an empty event stream.
  - >
    Governance step: portfolio and custom field configuration is a one-time
    administrative act with a named owner. Custom fields are addressed by gid,
    so a field recreated by hand gets a new gid and the exporter starts writing
    nowhere. Pin the gids in configuration and check them on start.
  - >
    If this exporter later exposes its own webhook receiver, copy Asana's own
    handshake shape rather than inventing one: the creation POST sends an
    X-Hook-Secret header that must be echoed back synchronously or registration
    fails.
