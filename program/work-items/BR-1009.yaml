id: BR-1009
title: "sbe watchdog: the 20-minute drift audit, shipped and on by default"
why: >
  Standing founder rule, stated twice on 2026-08-06 and ratified as law: the
  watchdog checks the project every 20 minutes while work is in flight, and it
  is a BrotherSBE feature that is ON BY DEFAULT, not a session habit someone
  remembers to arm. Phase 0 delivered the session half (a cheap read only agent
  on a 20 minute schedule) and the written half (docs/PRINCIPLES.md section 7).
  The durable half does not exist: when the session ends, the schedule dies with
  it, and the question list is prose rather than a command. This item makes the
  deterministic questions a command, wires the default arming, and records
  opt-out explicitly rather than assuming it.
persona_need: "P3 agent orchestrator, and P1 founder who is told the truth between checkpoints"
owner: fable-orchestrator
reviewer: independent-refuter
status: not_started
wave: phase-0
milestone: M1
depends_on:
  - "BR-1000"
spec: docs/PRINCIPLES.md
acceptance:
  - "sbe watchdog reports, for every registered fence, whether its worktree modified a file outside that fence, naming the file"
  - "it reports any commit created in a worker worktree, because workers never commit"
  - "it reports a lane whose declared files are absent or empty as stalled"
  - "it reports any em dash or en dash in the changed set"
  - "it reports NO-DATA, never clean, when the fence registry or a worktree it names is missing"
  - "it writes nothing and fixes nothing, proven by a test asserting the tree is byte identical after a run"
  - "mode is auto-detected from the fence registry and engine state: in flight, integrating, or idle; the check list matches the mode"
  - "cadence lives in configuration with 20 minutes in flight and 60 idle as the shipped defaults, snap-back on fence-open, never hardcoded at call sites"
  - "it audits the orchestrator too: recorded spend against the declared budget, and the state file agreeing with the owed register, each a named check"
  - "report contract: exit 0 and silent on clean, exit 1 with a JSON finding plus a one-line human summary; a boundary violation or worker commit is flagged stop-the-line"
  - "the audit is armed by default when a session or CI run starts work in a governed repository; disabling it is an explicit recorded opt-out, not an absence"
  - "the blocker audit (question H, added 2026-08-06 after the watchdog missed a real stall): every claimed wait names the recorded decision that makes it founder owned, and a wait already covered by standing authority is an alarm class finding (stalled delivery), never a clean heartbeat"
  - "python3 tools/test_sbe_watchdog.py prints OK"
estimated_days: 1
# cap basis: program/MASTER-PLAN-2026-08-06.md section 6, the founder-ratified
# hard per-loop budget of 2,000k output tokens. Hitting the cap STOPS the loop
# and raises a founder card; an overrun needs an explicit founder yes.
token_budget: 300000
tokens_used: null
started_at: null
completed_at: null
evidence: []
risks:
  - risk: "A watchdog that can write is a watchdog that can hide its own findings."
    mitigation: "Read only by construction, with a test asserting the tree is byte identical after a run."
    severity: high
  - risk: "Admitted while Phase 0 was in flight, which is the scope creep the plan's own one-loop rule exists to prevent."
    mitigation: "Recorded as a work item with its persona need, done-check and budget rather than built inside Phase 0, and it opens only when the owed register allows it."
    severity: medium
blocked_by:
  - "Phase 0 must land first: this reads the fence registry that Phase 0's dispatch gate defines."
alerts:
  - "Deliberately NOT built inside Phase 0. The session watchdog and the written principle cover the founder's ask today; this makes it mechanical and portable."
